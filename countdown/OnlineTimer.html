<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鍦ㄧ嚎璁℃椂鍣?/title>
<link rel="icon" href="/main.ico">
<link rel="stylesheet" type="text/css" href="/css/maincss.css">
<script src="/javascript/mainBgpicAutoInsert.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
  }
  .timer-container {
    text-align: center;
    max-width: 90%; /* 鏈€澶у搴︿负瑙嗗彛瀹藉害鐨?0% */
    max-height: 90%; /* 鏈€澶ч珮搴︿负瑙嗗彛楂樺害鐨?0% */
  }
  .timer {
    font-size: clamp(2rem, 4vw, 48px); /* 瀛椾綋澶у皬鍦?rem鍜?8px涔嬮棿骞虫粦鍙樺寲 */
    margin-bottom: 20px;
  }
  .buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .buttons div {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: clamp(1rem, 2vw, 16px); /* 瀛椾綋澶у皬鍦?rem鍜?6px涔嬮棿骞虫粦鍙樺寲 */
    cursor: pointer;
    text-align: center;
  }
  input {
    padding: 8px;
    font-size: clamp(1rem, 2vw, 16px); /* 瀛椾綋澶у皬鍦?rem鍜?6px涔嬮棿骞虫粦鍙樺寲 */
    margin-right: 10px;
    text-align: center;
  }
  #message {
    margin-top: 20px;
    font-size: clamp(1rem, 2vw, 16px); /* 瀛椾綋澶у皬鍦?rem鍜?6px涔嬮棿骞虫粦鍙樺寲 */
    color: red; /* 鍙互鏍规嵁闇€瑕佹洿鏀规秷鎭鑹?*/
  }
</style>
</head>
<body>

<div class="timer-container">
 <div id="bgpic"></div>
  <div class="timer" id="timer">00:00:00</div>
  <div class="buttons">
    <div>
      <button onclick="resetTimer()">閲嶇疆</button>
      <button id="pauseButton" onclick="pauseTimer()">鏆傚仠</button>
    </div>
    <div>
      <button onclick="addTime(1)">+1鍒嗛挓</button>
      <button onclick="addTime(5)">+5鍒嗛挓</button>
      <button onclick="addTime(10)">+10鍒嗛挓</button>
      <button onclick="addTime(30)">+30鍒嗛挓</button>
      <button onclick="addTime(60)">+60鍒嗛挓</button>
    </div>
    <div>
      <button onclick="subtractTime(1)">-1鍒嗛挓</button>
      <button onclick="subtractTime(5)">-5鍒嗛挓</button>
      <button onclick="subtractTime(10)">-10鍒嗛挓</button>
      <button onclick="subtractTime(30)">-30鍒嗛挓</button>
      <button onclick="subtractTime(60)">-60鍒嗛挓</button>
    </div>
  </div>
  <div style="margin-top: 20px;">
    <input type="number" id="customMinutes" placeholder="杈撳叆鍒嗛挓鏁? min="1">
    <button onclick="addCustomTime()">娣诲姞鑷畾涔夋椂闂?/button>
    <button onclick="subtractCustomTime()">鍑忓皯鑷畾涔夋椂闂?/button>
  </div>
  <div id="message"></div>
  <div>姝ら〉闈㈢敱AI鐢熸垚</div>
</div>

<script>
  let seconds = 0; // 鍊掕鏃跺垵濮嬬鏁?
  let intervalId = null;
  let isPaused = false; // 璺熻釜璁℃椂鍣ㄦ槸鍚︽殏鍋?

  function startTimer() {
    intervalId = setInterval(() => {
      if (!isPaused) {
        seconds--;
        if (seconds < 0) {
          clearInterval(intervalId);
          intervalId = null;
          document.getElementById('message').textContent = '鏃堕棿鍒?';
          return;
        }
        displayTime();
      }
    }, 1000);
  }

  function displayTime() {
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;
    document.getElementById('timer').textContent = 
      `${pad(hours)}:${pad(minutes)}:${pad(secs)}`;
  }

  function pad(number) {
    return number < 10 ? '0' + number : number;
  }

  function resetTimer() {
    clearInterval(intervalId);
    intervalId = null;
    seconds = 0;
    displayTime();
    document.getElementById('message').textContent = '';
    isPaused = false; // 纭繚閲嶇疆鏃惰鏃跺櫒涓嶆槸鏆傚仠鐘舵€?
    document.getElementById('pauseButton').textContent = '鏆傚仠';
  }

  function pauseTimer() {
    if (isPaused) {
      startTimer();
      isPaused = false;
      document.getElementById('pauseButton').textContent = '鏆傚仠';
    } else {
      clearInterval(intervalId);
      intervalId = null;
      isPaused = true;
      document.getElementById('pauseButton').textContent = '寮€濮?;
    }
  }

  function addTime(minutesToAdd) {
    seconds += minutesToAdd * 60;
    displayTime();
    if (!intervalId) {
      startTimer();
    }
  }

  function subtractTime(minutesToSubtract) {
    const totalSeconds = seconds - minutesToSubtract * 60;
    if (totalSeconds < 0) {
      document.getElementById('message').textContent = "鏃堕棿涓嶈冻锛屾棤娉曞噺灏戯紒";
      return;
    }
    seconds = totalSeconds;
    displayTime();
    if (!intervalId) {
      startTimer();
    }
  }

  function addCustomTime() {
    const customMinutes = document.getElementById('customMinutes').value;
    const minutesToAdd = parseInt(customMinutes);
    if (!isNaN(minutesToAdd) && minutesToAdd > 0) {
      addTime(minutesToAdd);
      document.getElementById('message').textContent = `宸叉坊鍔?${minutesToAdd} 鍒嗛挓`;
    } else {
      document.getElementById('message').textContent = "璇疯緭鍏ユ湁鏁堢殑鍒嗛挓鏁帮紒";
    }
  }

  function subtractCustomTime() {
    const customMinutes = document.getElementById('customMinutes').value;
    const minutesToSubtract = parseInt(customMinutes);
    if (!isNaN(minutesToSubtract) && minutesToSubtract > 0) {
      if (seconds >= minutesToSubtract * 60) {
        subtractTime(minutesToSubtract);
        document.getElementById('message').textContent = `宸插噺灏?${minutesToSubtract} 鍒嗛挓`;
      } else {
        document.getElementById('message').textContent = "鏃堕棿涓嶈冻锛屾棤娉曞噺灏戯紒";
      }
    } else {
      document.getElementById('message').textContent = "璇疯緭鍏ユ湁鏁堢殑鍒嗛挓鏁帮紒";
    }
  }
</script>

</body>

</body>
</html>
